# tmux для Go backend. Подключается из ~/.tmux.conf:
#   source-file ~/.config/dotfiles/tmux/tmux.conf   (строку добавляет install.sh)
#
# Сессия = проект (создаёт `dev`), окно = роль: editor/server/tests/infra/
# shell или backend/editor, backend/tests, … в монорепо. Pane — временный
# split внутри окна. Neovim отвечает за код, tmux — за процессы.

# ============================================================
# Терминал
# ============================================================

# tmux-256color есть в системной terminfo macOS. RGB — truecolor для
# catppuccin (termguicolors в nvim), usstyle — волнистое цветное
# подчёркивание диагностик gopls.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle"

# Esc в nvim без задержки (jk, выход из insert); 10 мс хватает, чтобы
# Alt-клавиши из iTerm (левый Option = Esc+) не распадались на Esc и букву.
set -s escape-time 10

# FocusGained/FocusLost доходят до nvim: autoread и gitsigns обновляются
# при возврате в окно editor после git checkout в соседнем окне.
set -g focus-events on

set -g history-limit 100000
set -g mouse on

# Заголовок вкладки iTerm: проект / роль.
set -g set-titles on
set -g set-titles-string "#S / #W"

# ============================================================
# Окна и панели
# ============================================================

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Закрыл последнее окно проекта — переход в другую сессию, а не выход из tmux.
set -g detach-on-destroy off

# Splits и новые окна — в каталоге текущей панели.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Панели — как окна nvim (там Ctrl-h/j/k/l, здесь prefix h/j/k/l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# prefix f — переключатель проектов: открытые сессии и каталоги проектов
# в fzf, новый проект открывается через `dev` (вместо find-window). Список с
# превью — на весь экран, как окна поиска в nvim.
bind f display-popup -E -w 100% -h 100% -T " проекты " "~/.config/dotfiles/tmux/projects"

# prefix g — lazygit в каталоге текущей панели: тот репозиторий, worktree
# задачи или подпроект, где сейчас стоишь. Конфиг — git/lazygit.yml.
# Заменяет меню перемещения плавающих панелей tmux 3.8 (switch-client -T move).
bind g display-popup -E -w 100% -h 100% -d "#{pane_current_path}" -T " git " lazygit

# prefix G — изменения и история того же репозитория, только просмотр:
# файлы и коммиты списком, diff через delta или difftastic (tmux/gitview).
# На весь экран, как prefix f.
bind G display-popup -E -w 100% -h 100% -d "#{pane_current_path}" -T " git · просмотр " "~/.config/dotfiles/tmux/gitview"

# prefix i — документация проекта текущей панели: README и docs/, контракты
# (.proto, OpenAPI), Go-пакеты с go doc, шпаргалка клавиш окружения
# (tmux/docs). Вместо display-message; не d — это отключение от сессии.
# На весь экран, как prefix f.
bind i display-popup -E -w 100% -h 100% -d "#{pane_current_path}" -T " документация " "~/.config/dotfiles/tmux/docs"

# ============================================================
# Статус команд в фоновых окнах
# ============================================================

# zshrc.zsh ставит окну опцию @cmd: run, пока идёт команда, ok/fail по
# завершении. Статус-бар рисует ● ✓ ✗ у фоновых окон; при входе в окно
# результат считается увиденным и метка гаснет (идущая ● остаётся).
set-hook -g session-window-changed 'if -F "#{!=:#{@cmd},run}" "set -wu @cmd"'
set-hook -g client-session-changed 'if -F "#{!=:#{@cmd},run}" "set -wu @cmd"'

# Агент (Claude Code) из своих хуков ставит окну опцию @attention
# (tmux/attention): wait — ждёт подтверждения или ответа, done — закончил
# ход, busy — работает. Статус-бар рисует ? у окна, которое ждёт, ✓ у
# закончившего; дерево prefix s перечисляет такие окна у каждой сессии;
# справа — счётчик ждущих окон по всем сессиям. При входе в окно done
# считается увиденным и гаснет, wait остаётся, пока агент не получит
# ответ.
set-hook -g session-window-changed[2] 'run-shell -b "~/.config/dotfiles/tmux/attention seen -t #{window_id}"'
set-hook -g client-session-changed[2] 'run-shell -b "~/.config/dotfiles/tmux/attention seen -t #{window_id}"'

# Команда дольше 10 с звонит bell: фоновое окно подсвечивается, а bell
# уходит в iTerm (вкладка/Dock, если iTerm не в фокусе). Bell из окна,
# на которое смотришь, игнорируется.
set -g bell-action other
set -g visual-bell off

# Проверка окружения проекта (dev -c) при входе в сессию: проблемы —
# жёлтой плашкой справа (@dev_warn) и сообщением; подробно — `dev -c`.
set-hook -g client-attached[0] 'run-shell -b "~/.config/dotfiles/tmux/dev -c -q #{q:session_name}"'
set-hook -g client-session-changed[1] 'run-shell -b "~/.config/dotfiles/tmux/dev -c -q #{q:session_name}"'

# ============================================================
# Снимок сессий (dev -s, dev -r)
# ============================================================

# После каждого изменения окон и панелей dev пишет снимок сессий (окна,
# раскладки, каталоги) в ~/.local/state/dev/sessions; после перезагрузки
# `dev -r` поднимает их снова, prefix f показывает их как ○. Из хука dev
# ждёт секунду: серия событий даёт один снимок, а при остановке сервера
# сессий уже нет и файл остаётся прежним.
set-hook -g after-new-session 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g after-new-window 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g after-split-window 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g after-kill-pane 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g after-select-layout 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g after-select-window 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g after-rename-window 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g after-resize-pane 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g pane-exited 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g window-unlinked 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g session-closed 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g client-detached 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'
set-hook -g client-session-changed[2] 'run-shell -b "~/.config/dotfiles/tmux/dev -s -q"'

# ============================================================
# Copy mode: vi-клавиши, копирование в системный буфер
# ============================================================

setw -g mode-keys vi
set -s copy-command "pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ============================================================
# Дедлайны (команда deadline из zsh-config/zshrc.zsh)
# ============================================================

# prefix t — подробный обзор с прогрессом (вместо часов clock-mode).
bind t display-popup -E -w 62 -h 70% -T " дедлайны " "~/.config/dotfiles/tmux/deadline-view.sh"

# ============================================================
# Статус-бар (палитра catppuccin mocha, как в nvim)
# ============================================================

set -g status-interval 2
set -g status-style "bg=#181825,fg=#a6adc8"
# Имя сессии — синим на тёмной плашке, как у текущего окна; ярко только
# пока что-то ждёт: жёлтая плашка — нажат prefix и tmux ждёт команду,
# сиреневая — панель в copy mode (например, после прокрутки колесом).
set -g status-left-length 60
# Сессия задачи зовётся «проект@ветка» (dev -b): слева плашка проекта без
# «@ветка», рядом вторая, лавандовая, с веткой — тем же цветом, что «@» у
# worktree в git-сегменте справа. У обычной сессии второй плашки нет.
set -g status-left "#[fg=#{?client_prefix,#1e1e2e,#{?pane_in_mode,#1e1e2e,#89b4fa}},bg=#{?client_prefix,#f9e2af,#{?pane_in_mode,#cba6f7,#313244}},bold] #{s/@.*$//:session_name} #[default]#{?#{m:*@*,#{session_name}},#[fg=#b4befe#,bg=#313244] @#{s/^[^@]*@//:session_name} #[default],} "
set -g window-status-separator ""
# Номер окна тусклее имени: глаз ищет имя, номер — для prefix N.
set -g window-status-format " #[fg=#6c7086]#I #[fg=#a6adc8]#W#{?#{==:#{@cmd},run},#[fg=#f9e2af] ●,}#{?#{==:#{@cmd},ok},#[fg=#a6e3a1] ✓,}#{?#{==:#{@cmd},fail},#[fg=#f38ba8] ✗,}#{?#{==:#{@attention},wait},#[fg=#f9e2af#,bold] ?,}#{?#{==:#{@attention},done},#[fg=#a6e3a1] ✓,} "
# Текущее окно — плашкой, без подчёркивания (его добавлял стиль tmux по
# умолчанию). zoom — окно развёрнуто на одну панель (prefix z). Агент,
# ждущий ответа, виден и здесь.
set -g window-status-current-style default
set -g window-status-current-format "#[fg=#9399b2,bg=#313244] #I #[fg=#cdd6f4,bold]#W#{?window_zoomed_flag,#[fg=#f9e2af] zoom,}#{?#{==:#{@attention},wait},#[fg=#f9e2af] ?,} #[default]"

# prefix S — вид: окна из разных сессий на одном экране (tmux/view). Окно
# выбора — fzf: Tab отмечает окна, Enter собирает вид (ждущие агента —
# первыми, справа превью панели); в виде prefix S возвращает всё на места.
# В дереве prefix s то же через отметки: t на окнах, затем
# «:run "~/.config/dotfiles/tmux/view pick %%"».
bind S run-shell -b "~/.config/dotfiles/tmux/view toggle"

# prefix s — дерево сессий со строкой на сессию: сколько окон и какие из
# них ждут (? жёлтым — подтверждения, ✓ зелёным — закончили); у окна
# внутри раскрытой сессии — то же словами. Остальное как у tmux.
bind s choose-tree -Zs -F "#{?pane_format,#{pane_current_command} \"#{pane_title}\",#{?window_format,#{p18:#{window_name}#{window_flags}}#{?#{==:#{@attention},wait},#[fg=#f9e2af#,bold]? ждёт подтверждения#[default],}#{?#{==:#{@attention},done},#[fg=#a6e3a1]✓ закончил#[default],},#{?#{e|<|:#{n:session_name},1}, ,}#{?#{e|<|:#{n:session_name},2}, ,}#{?#{e|<|:#{n:session_name},3}, ,}#{?#{e|<|:#{n:session_name},4}, ,}#{?#{e|<|:#{n:session_name},5}, ,}#{?#{e|<|:#{n:session_name},6}, ,}#{?#{e|<|:#{n:session_name},7}, ,}#{?#{e|<|:#{n:session_name},8}, ,}#{?#{e|<|:#{n:session_name},9}, ,}#{?#{e|<|:#{n:session_name},10}, ,}#{?#{e|<|:#{n:session_name},11}, ,}#{?#{e|<|:#{n:session_name},12}, ,}#{?#{e|<|:#{n:session_name},13}, ,}#{?#{e|<|:#{n:session_name},14}, ,}#{?#{e|<|:#{n:session_name},15}, ,}#{?#{e|<|:#{n:session_name},16}, ,}#{?#{e|<|:#{n:session_name},17}, ,}#{?#{e|<|:#{n:session_name},18}, ,}#{?#{e|<|:#{n:session_name},19}, ,}#{?#{e|<|:#{n:session_name},20}, ,}#{?#{e|<|:#{n:session_name},21}, ,}#{?#{e|<|:#{n:session_name},22}, ,}#{p-2:session_windows} windows  #{W:#{?#{==:#{@attention},wait},#[fg=#f9e2af#,bold]? #{window_name}#[default]  ,}}#{W:#{?#{==:#{@attention},done},#[fg=#a6e3a1]✓ #{window_name}#[default]  ,}}#{?session_attached,#[fg=#6c7086]· attached#[default],}}}"
set -g window-status-bell-style "fg=#f9e2af,bold"

# Справа — счётчик окон, где агент ждёт подтверждения, по всем сессиям
# (attention status: жёлтая плашка «? 2», пусто, когда никто не ждёт),
# git каталога активной панели (git-status.sh: ветка со знаками промпта
# zsh `*` и `+`, ↑↓ относительно upstream, @ветка в worktree), проблема
# окружения проекта (dev -c), плашки дедлайнов (deadline.sh), время.
set -g status-right-length 200
set -g status-right "#(~/.config/dotfiles/tmux/view status)#(~/.config/dotfiles/tmux/attention status)#(~/.config/dotfiles/tmux/git-status.sh #{q:pane_current_path})#{?#{@dev_warn},#[fg=#1e1e2e#,bg=#f9e2af] ⚠ #{=50:@dev_warn} #[default] ,}#(~/.config/dotfiles/tmux/deadline.sh) #[fg=#6c7086]%H:%M "

# Рамки панелей — цветом разделителей окон nvim (WinSeparator catppuccin),
# у активной панели чуть светлее; рамки всплывающих окон — синие, как у
# окон документации nvim (FloatBorder).
set -g pane-border-style "fg=#11111b"
set -g pane-active-border-style "fg=#45475a"
set -g popup-border-style "fg=#89b4fa"
set -g popup-border-lines rounded
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

# ------------------------------------------------------------
# Русская раскладка
# ------------------------------------------------------------
# После вопроса агенту раскладка осталась русской — prefix s приходит как
# prefix ы. Каждая привязка на латинской букве (таблицы prefix, Alt-буква в
# root, copy mode) повторяется на букве той же клавиши в русской раскладке
# (tmux/ru-keys; после своих привязок — prefix r).
run-shell "~/.config/dotfiles/tmux/ru-keys"
