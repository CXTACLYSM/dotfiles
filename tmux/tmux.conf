# tmux для Go backend. Подключается из ~/.tmux.conf:
#   source-file ~/.config/dotfiles/tmux/tmux.conf   (строку добавляет install.sh)
#
# Сессия = проект (создаёт `dev`), окно = роль: editor/server/tests/infra/
# shell или backend/editor, backend/tests, … в монорепо. Pane — временный
# split внутри окна. Neovim отвечает за код, tmux — за процессы.

# ============================================================
# Терминал
# ============================================================

# tmux-256color есть в системной terminfo macOS. RGB — truecolor для
# catppuccin (termguicolors в nvim), usstyle — волнистое цветное
# подчёркивание диагностик gopls.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:usstyle"

# Esc в nvim без задержки (jk, выход из insert); 10 мс хватает, чтобы
# Alt-клавиши из iTerm (левый Option = Esc+) не распадались на Esc и букву.
set -s escape-time 10

# FocusGained/FocusLost доходят до nvim: autoread и gitsigns обновляются
# при возврате в окно editor после git checkout в соседнем окне.
set -g focus-events on

set -g history-limit 100000
set -g mouse on

# Заголовок вкладки iTerm: проект / роль.
set -g set-titles on
set -g set-titles-string "#S / #W"

# ============================================================
# Окна и панели
# ============================================================

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Закрыл последнее окно проекта — переход в другую сессию, а не выход из tmux.
set -g detach-on-destroy off

# Splits и новые окна — в каталоге текущей панели.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Панели — как окна nvim (там Ctrl-h/j/k/l, здесь prefix h/j/k/l).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"

# prefix f — переключатель проектов: открытые сессии и каталоги проектов
# в fzf, новый проект открывается через `dev` (вместо find-window).
bind f display-popup -E -w 80% -h 60% -T " проекты " "~/.config/dotfiles/tmux/projects"

# prefix g — lazygit в каталоге текущей панели: тот репозиторий, worktree
# задачи или подпроект, где сейчас стоишь. Конфиг — git/lazygit.yml.
# Заменяет меню перемещения плавающих панелей tmux 3.8 (switch-client -T move).
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -T " git " lazygit

# prefix i — документация проекта текущей панели: README и docs/, контракты
# (.proto, OpenAPI), Go-пакеты с go doc, шпаргалка клавиш окружения
# (tmux/docs). Вместо display-message; не d — это отключение от сессии.
bind i display-popup -E -w 90% -h 85% -d "#{pane_current_path}" -T " документация " "~/.config/dotfiles/tmux/docs"

# ============================================================
# Статус команд в фоновых окнах
# ============================================================

# zshrc.zsh ставит окну опцию @cmd: run, пока идёт команда, ok/fail по
# завершении. Статус-бар рисует ● ✓ ✗ у фоновых окон; при входе в окно
# результат считается увиденным и метка гаснет (идущая ● остаётся).
set-hook -g session-window-changed 'if -F "#{!=:#{@cmd},run}" "set -wu @cmd"'
set-hook -g client-session-changed 'if -F "#{!=:#{@cmd},run}" "set -wu @cmd"'

# Команда дольше 10 с звонит bell: фоновое окно подсвечивается, а bell
# уходит в iTerm (вкладка/Dock, если iTerm не в фокусе). Bell из окна,
# на которое смотришь, игнорируется.
set -g bell-action other
set -g visual-bell off

# Проверка окружения проекта (dev -c) при входе в сессию: проблемы —
# жёлтой плашкой справа (@dev_warn) и сообщением; подробно — `dev -c`.
set-hook -g client-attached[0] 'run-shell -b "~/.config/dotfiles/tmux/dev -c -q #{q:session_name}"'
set-hook -g client-session-changed[1] 'run-shell -b "~/.config/dotfiles/tmux/dev -c -q #{q:session_name}"'

# ============================================================
# Copy mode: vi-клавиши, копирование в системный буфер
# ============================================================

setw -g mode-keys vi
set -s copy-command "pbcopy"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# ============================================================
# Дедлайны (команда deadline из zsh-config/zshrc.zsh)
# ============================================================

# prefix t — подробный обзор с прогрессом (вместо часов clock-mode).
bind t display-popup -E -w 62 -h 70% -T " дедлайны " "~/.config/dotfiles/tmux/deadline-view.sh"

# ============================================================
# Статус-бар (палитра catppuccin mocha, как в nvim)
# ============================================================

set -g status-interval 2
set -g status-style "bg=#181825,fg=#a6adc8"
# Имя сессии меняет цвет: жёлтое — нажат prefix и tmux ждёт команду,
# сиреневое — панель в copy mode (например, после прокрутки колесом).
set -g status-left-length 40
set -g status-left "#[fg=#1e1e2e,bg=#{?client_prefix,#f9e2af,#{?pane_in_mode,#cba6f7,#89b4fa}},bold] #S #[default] "
set -g window-status-separator ""
set -g window-status-format " #I #W#{?#{==:#{@cmd},run},#[fg=#f9e2af] ●,}#{?#{==:#{@cmd},ok},#[fg=#a6e3a1] ✓,}#{?#{==:#{@cmd},fail},#[fg=#f38ba8] ✗,} "
# zoom — окно развёрнуто на одну панель (prefix z), остальные скрыты.
set -g window-status-current-format "#[fg=#cdd6f4,bg=#313244,bold] #I #W#{?window_zoomed_flag,#[fg=#f9e2af] zoom,} #[default]"
set -g window-status-bell-style "fg=#f9e2af,bold"

# Справа — проблема окружения проекта (dev -c), плашки дедлайнов
# (deadline.sh), время.
set -g status-right-length 200
set -g status-right "#{?#{@dev_warn},#[fg=#1e1e2e#,bg=#f9e2af] ⚠ #{=50:@dev_warn} #[default] ,}#(~/.config/dotfiles/tmux/deadline.sh) #[fg=#6c7086]%H:%M "

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g popup-border-style "fg=#89b4fa"
set -g popup-border-lines rounded
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
